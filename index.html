<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>La Légende des Trois Mouskito</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&display=swap">
<style>
/* Console de poche : un écran 3:2 serti dans un boîtier sombre, contrôles tactiles dessous sur téléphone */
:root{
  --bg:#15121d; --bezel:#2a2538; --bezel-hi:#3c3552; --ink:#ece5d3; --muted:#9d95b0;
  --gold:#f2c14e; --btn:#3b3550; --btn-a:#c4473c; --btn-b:#3e6db3;
  --f-ui:"Pixelify Sans","Trebuchet MS",ui-sans-serif,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#frame{width:min(100%,980px,calc((100vh - 90px) * 1.5));width:min(100%,980px,calc((100dvh - 90px) * 1.5));background:var(--bezel);border-radius:16px;padding:10px;box-sizing:border-box;box-shadow:inset 0 0 0 2px var(--bezel-hi),0 24px 60px rgba(0,0,0,.55)}
canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border-radius:6px;outline:none}
canvas:focus-visible{box-shadow:0 0 0 3px var(--gold)}
.help{margin:0;color:var(--muted);font-size:14px;text-align:center;line-height:1.6;max-width:62ch}
.help kbd{font-family:inherit;font-size:13px;background:var(--btn);color:var(--ink);padding:1px 7px;border-radius:5px;border-bottom:2px solid #0c0a12;white-space:nowrap}
#pad{display:none;width:min(100%,520px);max-width:100%;justify-content:space-between;align-items:center;gap:8px;box-sizing:border-box}
body.touch #pad{display:flex}
body.touch .help{display:none}
body.touch #frame{width:min(100%,980px,calc((100vh - 250px) * 1.5));width:min(100%,980px,calc((100dvh - 250px) * 1.5))}
.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}
.pbtn{appearance:none;border:0;background:var(--btn);color:var(--ink);font:600 18px var(--f-ui);border-radius:10px;box-shadow:0 4px 0 #0c0a12;touch-action:none;display:flex;align-items:center;justify-content:center}
.pbtn:active,.pbtn.on{transform:translateY(3px);box-shadow:0 1px 0 #0c0a12}
.pbtn:focus-visible{outline:2px solid var(--gold)}
.dpad .up{grid-area:1/2}.dpad .left{grid-area:2/1}.dpad .right{grid-area:2/3}.dpad .down{grid-area:3/2}
.mid{display:flex;flex-direction:column;gap:10px}
.mid .pbtn{height:32px;padding:0 10px;font-size:13px;border-radius:16px}
.ab{display:flex;gap:10px;align-items:center}
.ab .pbtn{width:58px;height:58px;border-radius:50%;font-size:22px}
.ab .a{background:var(--btn-a);margin-top:-30px}.ab .b{background:var(--btn-b)}
body.touch{-webkit-touch-callout:none;overscroll-behavior:none}
@media (orientation:landscape){
  body.touch{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:1fr 1fr;grid-template-areas:"dpad frame ab" "dpad frame mid";align-items:center;justify-items:center;column-gap:14px}
  body.touch #pad{display:contents}
  body.touch .dpad{grid-area:dpad}
  body.touch .ab{grid-area:ab;align-self:end}
  body.touch .ab .a{margin-top:0}
  body.touch .mid{grid-area:mid;align-self:start}
  body.touch #frame{grid-area:frame;width:min(100%,calc((100vh - 24px) * 1.5));width:min(100%,calc((100dvh - 24px) * 1.5))}
}
@media (prefers-reduced-motion:reduce){.pbtn:active{transform:none}}
</style>

<div id="frame"><canvas id="c" width="960" height="640" tabindex="0" aria-label="La Légende des Trois Mouskito, jeu"></canvas></div>
<p class="help"><kbd>Flèches</kbd> ou <kbd>WASD</kbd> se déplacer · <kbd>Espace</kbd> / <kbd>Entrée</kbd> parler, valider · <kbd>X</kbd> retour (maintenir pour courir) · <kbd>Échap</kbd> menu · <kbd>M</kbd> son</p>
<div id="pad" aria-label="Manette tactile">
  <div class="dpad">
    <button class="pbtn up" data-k="up" aria-label="Haut">▲</button>
    <button class="pbtn left" data-k="left" aria-label="Gauche">◀</button>
    <button class="pbtn right" data-k="right" aria-label="Droite">▶</button>
    <button class="pbtn down" data-k="down" aria-label="Bas">▼</button>
  </div>
  <div class="mid"><button class="pbtn" data-k="menu">MENU</button><button class="pbtn" data-k="mute">SON</button></div>
  <div class="ab"><button class="pbtn b" data-k="b" aria-label="Bouton B">B</button><button class="pbtn a" data-k="a" aria-label="Bouton A">A</button></div>
</div>

function hx(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}

function harden(c){const x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height),a=d.data;for(let i=3;i<a.length;i+=4)a[i]=a[i]>110?255:0;x.putImageData(d,0,0);}
function outline(c,col){const x=c.getContext('2d'),w=c.width,h=c.height,d=x.getImageData(0,0,w,h),a=d.data,s=new Uint8ClampedArray(a),[r,gg,b]=hx(col);
  const n=(X,Y)=>X>=0&&Y>=0&&X<w&&Y<h&&s[(Y*w+X)*4+3];
  for(let y=0;y<h;y++)for(let X=0;X<w;X++){const i=(y*w+X)*4;if(s[i+3])continue;if(n(X-1,y)||n(X+1,y)||n(X,y-1)||n(X,y+1)){a[i]=r;a[i+1]=gg;a[i+2]=b;a[i+3]=255;}}
  x.putImageData(d,0,0);}
function ellp(x,cx,cy,rx,ry,col,y0=-1e9,y1=1e9){x.fillStyle=col;for(let yy=Math.ceil(cy-ry);yy<=Math.floor(cy+ry);yy++){if(yy<y0||yy>y1)continue;const dy=(yy-cy)/ry,w=Math.sqrt(Math.max(0,1-dy*dy))*rx;const L=Math.round(cx-w),R=Math.round(cx+w);x.fillRect(L,yy,Math.max(1,R-L),1);}}
function sprite(w,h,fn,ol='#1f1a2e'){const[c,x]=mk(w+2,h+2);x.save();x.translate(1,1);const p=(X,Y,ww,hh,col)=>{if(ww<=0||hh<=0)return;x.fillStyle=col;x.fillRect(X,Y,ww,hh);};fn(x,p);x.restore();harden(c);if(ol)outline(c,ol);return c;}
function flipC(c){const[n,x]=mk(c.width,c.height);x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return n;}

/* ================= INPUT ================= */
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'a',Enter:'a',NumpadEnter:'a',KeyE:'a',KeyK:'a',KeyX:'b',Backspace:'b',ShiftLeft:'b',ShiftRight:'b',KeyJ:'b',Escape:'menu',Tab:'menu',KeyP:'menu'};
const held={};let pressQ=new Set(),pressed=new Set();const dirStack=[];

function release(k){held[k]=false;const i=dirStack.indexOf(k);if(i>=0)dirStack.splice(i,1);}
addEventListener('keydown',e=>{if(e.key==='m'||e.key==='M'){toggleMute();return;}const k=KEYMAP[e.code];if(!k)return;e.preventDefault();if(e.repeat)return;press(k);});

addEventListener('blur',()=>{for(const k in held)held[k]=false;dirStack.length=0;});

  b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');if(k==='mute'){toggleMute();return;}press(k);try{b.setPointerCapture(e.pointerId);}catch(_){}});
  const up=()=>{b.classList.remove('on');if(k!=='mute')release(k);};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());});

function heldDir(){for(let i=dirStack.length-1;i>=0;i--)if(held[dirStack[i]])return DIRK[dirStack[i]];return null;}

function makeHero(id,lvl=5){const h={id,first:HEROES[id].first,n:HEROES[id].first,lvl,xp:0,moves:HEROES[id].moves.slice(),st:{atk:0,def:0},conf:0,stun:false};calcStats(h,true);return h;}
function calcStats(h,full){const d=HEROES[h.id],L=h.lvl-5,old=h.maxhp||0;h.maxhp=d.base.hp+L*d.grow.hp;h.atk=d.base.atk+L*d.grow.atk;h.def=d.base.def+L*d.grow.def;h.spd=d.base.spd+L*d.grow.spd;if(full||!old)h.hp=h.maxhp;else if(h.hp>0)h.hp=Math.min(h.maxhp,h.hp+h.maxhp-old);}
function newGame(id){G={hero:id,party:[id],heroes:{},flags:{},bag:{sandwich:0,kombucha:0,cafe:0},flowers:{},copeaux:{},ach:{},patrick:0,since:0,start:Date.now(),ch:1};for(const k in HEROES)G.heroes[k]=makeHero(k);buildMaps();}
function newGame2(id){newGame(id);G.ch=2;G.party=[id,...['guilhem','nicodeme','yvain'].filter(k=>k!==id)];for(const k of G.party){const h=G.heroes[k];h.lvl=8;h.xp=0;calcStats(h,true);}G.bag={sandwich:3,kombucha:2,cafe:1};}
const SK=c=>'mouskito-save-ch'+c;
function saveGame(){if(!G||(G.ch!==2&&G.ch!==3))return;try{const P=WORLD.player;localStorage.setItem(SK(G.ch),JSON.stringify({G,map:WORLD.map.id,x:P.x,y:P.y,dir:P.dir}));showToast('Partie sauvegardée');}catch(e){}}
function loadSave(c=2){try{const v=localStorage.getItem(SK(c));return v?JSON.parse(v):null;}catch(e){return null;}}
function clearSave(c=2){try{localStorage.removeItem(SK(c));}catch(e){}}
function getDone(){try{return JSON.parse(localStorage.getItem('mouskito-done')||'[]');}catch(e){return[];}}
function markDone(n){try{const d=getDone();if(!d.includes(n))d.push(n);localStorage.setItem('mouskito-done',JSON.stringify(d));}catch(e){}}
const H=()=>HEROES[G.hero].first;

function healAll(){for(const id of G.party){const h=G.heroes[id];h.hp=h.maxhp;}}
function unlock(k){if(G.ach[k])return;G.ach[k]=true;showToast('Succès débloqué : '+ACH[k].n);SFX.level();}

async function recruit(id,o){SFX.item();G.party.push(id);const h=G.heroes[id];h.lvl=Math.max(h.lvl,G.heroes[G.hero].lvl);h.xp=0;calcStats(h,true);WORLD.followers.push(ent(o.x,o.y,o.dir,id));await say(`${HEROES[id].name} rejoint l'équipe !`);if(G.party.length===3){await wait(10);await say('L\'équipe est au complet. Trois apprentis, trois caractères, une seule direction : le Pont des Apprentis, à l\'est.');}}
const FLW={f1:'le Pissenlit Légendaire',f2:"l'Edelweiss des Quais",f3:"l'Orchidée à Copeaux"};
async function pickFlower(id){G.flowers[id]=true;SFX.item();const n=Object.keys(G.flowers).length;await say(`Tu cueilles ${FLW[id]} ! Une espèce rare. (${n}/3)`);if(!G.flags.nicoQuest)await say('Une personne passionnée de botanique serait sûrement ravie de la voir.');}
async function pickCopeau(id){G.copeaux[id]=true;SFX.item();const n=Object.keys(G.copeaux).length;await say(`Tu trouves un Copeau d'Or ! (${n}/5) Il brille comme un vernis tout frais.`);if(n>=5)unlock('copeaux');}
async function wakeScript(){await say('Le soleil se lève sur Vevey, la plus belle ville du monde. (Selon Yvain.)');await say('Aujourd\'hui est un grand jour : le Stage d\'Observation à l\'Atelier du Maître Rabotin !');
  if(G.hero==='guilhem'){await say('Bon. Je pars ce matin. Enfin… oui. Vraiment, cette fois.','guilhem');}
  if(G.hero==='nicodeme'){await say('Un stage d\'observation… Pour un futur naturaliste, c\'est pas faux comme programme.','nicodeme');}
  if(G.hero==='yvain'){await say('J\'y vais !','yvain');await say('… Mais d\'abord, peut-être, mettre des chaussures. Et prendre ma kombucha maison.','yvain');await give('kombucha',2);}
  await say(document.body.classList.contains('touch')?'(Croix pour te déplacer, A pour parler, MENU pour l\'équipe et les objectifs.)':'(Flèches pour te déplacer, Espace pour parler, Échap pour le menu. Maintiens X pour courir.)');}
async function giveSandwich(){G.flags.sandwich=true;await say(`${H()} ! Tu pars à l'Atelier ? Prends ces sandwichs. Un artisan ne combat jamais le ventre vide.`,'Maman');await give('sandwich',3);await say('Et sois poli avec le Maître Rabotin. Avec le Concierge aussi, même s\'il pose des questions bizarres.','Maman');}
async function talkMaman(){if(!G.flags.sandwich){await giveSandwich();return;}healAll();SFX.heal();await say('Tu as l\'air fatigué. Une bonne soupe, et ça repart ! (L\'équipe est soignée.)','Maman');}
async function consoleAct(){if(G.flags.console){await say('La console. Une autre partie ? … Non. Le Maître Rabotin attend.');return;}
  const i=await ask('Une console de jeux. Une petite partie avant de partir ?',['Juste une','Non']);if(i!==0){await say('Sage décision. Rare, mais sage.');return;}
  await fadeTo(1,20);await say('Trois heures plus tard…');await fadeTo(0,20);G.flags.console=true;unlock('console');healAll();await say('Comme au bon vieux temps des cours de dessin technique. Tu te sens reposé, et légèrement coupable.');}
async function tubAct(){await say('Une baignoire. Elle t\'inspire une étrange nostalgie, mêlée d\'un léger mal de tête.');}
async function bedAct(){await say('Ton lit. Il t\'appelle. Résiste.');}
async function shelfAct(){const t={guilhem:'Des livres d\'histoire, de philosophie et un manuel d\'anglais. Un jour, peut-être, l\'Albion…',nicodeme:'Un herbier, trois méthodes de guitare et un guide des oiseaux du Léman. Tout est annoté.',yvain:'Un catalogue de bois exotiques, un manuel de plongée et une bande dessinée très lue.'};await say(t[G.hero]);}
async function plantAct(x){if(x===13&&!G.copeaux.c1){await say('Derrière la plante, quelque chose brille…');await pickCopeau('c1');}else await say('Une plante verte. Elle a l\'air d\'aller bien.');}
async function benchAct(){await say('Un établi. Quelqu\'un y a gravé « G + N + Y » au canif. Tiens, tiens.');}
async function fountainAct(){healAll();SFX.heal();await say('La fontaine de Vevey. Son eau claire redonne des forces à toute l\'équipe !');}
async function balconAct(){unlock('balcon');await say('La Maison du Balcon. On raconte que deux apprentis observèrent un jour, depuis ce balcon, un troisième en grande conversation avec une demoiselle.');await say('Ils observèrent longtemps. Avec un sérieux tout scientifique.');
  if(inParty('nicodeme')&&G.party.length>1)await say('Pourquoi tout le monde me regarde, d\'un coup ?','nicodeme');else await say('L\'histoire ne dit pas comment ça s\'est terminé. L\'histoire est polie.');}
const IRMA={guilhem:'Toi, Guilhem… je vois une île brumeuse et une langue étrange. Puis des livres, des montagnes de livres, et un titre de docteur au bout du chemin. Et je vois… que tu viendras ce soir. Enfin non.',
  nicodeme:'Toi, Nicodème… je vois des plantes. Des milliers de plantes. Et des oiseaux, des insectes, des grenouilles. Tu les compteras tous, un par un. Et des ronces… beaucoup de ronces. C\'est pas faux.',
  yvain:'Toi, Yvain… je vois une grande Maîtrise. Fédérale, même. Je vois des apprentis qui t\'écoutent. Et je vois… l\'amour ! Ah non, pardon, c\'était un reflet sur le lac. Pourtant, quel parti ! Loyal, drôle, courageux, bâtisseur de châteaux… Les dames de Lémanie ne savent pas ce qu\'elles ratent.'};
async function talkIrma(){unlock('irma');await say('Approchez, jeunes gens… Madame Irma lit l\'avenir dans les copeaux de bois.','Madame Irma');for(const id of G.party)await say(IRMA[id],'Madame Irma');await say('Ce sera dix francs. … Je plaisante. Le destin, lui, est gratuit.','Madame Irma');}
async function talkEmeric(){if(inParty('yvain')){await say('Yvain ! Ce soir, on sort avec toute la bande ?','Emeric');await say('J\'y vais !','yvain');await say('… Enfin, après l\'entretien. Et après la Forêt. Et après le Concierge.','yvain');await say('Comme d\'habitude, quoi. On t\'attend au bistrot, on te garde une place.','Emeric');return;}
  await say('Salut ! Moi c\'est Emeric. Yvain et moi, on a grandi ensemble ici, dans la plus belle ville du monde.','Emeric');await say('Tu le cherches ? Il s\'échauffe juste là, au bord du lac. Si tu l\'emmènes, ramène-le pour la soirée !','Emeric');}
async function castleAct(){await say('Un château de sable démesuré : quatre tours, un pont-levis, des douves et un système d\'irrigation qui fonctionne vraiment.');await say('Une pancarte précise : « Bâti par Yvain. Comme dans mes jeux vidéo, mais en vrai. »');if(inParty('yvain'))await say('Il manque encore l\'aile ouest. Et un donjon. Et peut-être une cathédrale.','yvain');}
async function talkMamie(){const miss=['guilhem','nicodeme','yvain'].filter(k=>!inParty(k));if(!miss.length){await say('Trois jeunes gens ensemble ! Ça me rappelle ma jeunesse. Enfin, je crois. J\'ai quatre-vingt-sept ans.','Mamie Josette');return;}
  const where={guilhem:'un grand garçon à écharpe, plongé dans un livre près de la bibliothèque',nicodeme:'un barbu qui joue de la musique dans le parc, à l\'ouest',yvain:'un costaud à casquette qui fait des étirements au bord du lac'};
  await say(`Tu cherches des compagnons ? J'ai vu ${miss.map(k=>where[k]).join(', et ')}.`,'Mamie Josette');await say('Mais je ne suis plus sûre de rien. J\'ai quatre-vingt-sept ans.','Mamie Josette');}
async function talkPatrick(o){G.patrick++;if(G.patrick>=3)unlock('patrick');if(G.patrick===1){SFX.blower();await say('Le Concierge souffle des feuilles mortes sur le pont avec une machine assourdissante. VRRRRRRR… Il s\'arrête net.');}

  if(G.party.length<3){const i=await ask('Vous êtes qui ?',[`Je suis ${H()}.`,'Un futur apprenti.','Personne.'],'Le Concierge');
    const rep=[`${H()} ? Connais pas. Personne ne passe seul sur le Pont des Apprentis. Règlement, article 3, alinéa Copeau.`,'Un apprenti tout seul, c\'est juste un moustique égaré. Il en faut trois pour faire un essaim.','Personne ? Alors Personne ne passe. C\'est logique.'];
    await say(rep[i],'Le Concierge');await say('(Il te faudrait des compagnons. Peut-être en ville ?)');return;}
  const i=await ask('Vous êtes qui ?',['Des touristes.','Les Trois Mouskito !','Et vous, vous êtes qui ?'],'Le Concierge');
  if(i===0){await say('Des touristes ? À Vevey ? … C\'est plausible. Mais non.','Le Concierge');return;}
  if(i===2){await say('Moi ? Je suis le Concierge. … Mais VOUS, vous êtes qui ?','Le Concierge');return;}
  await say('Les Trois Mouskito ? … Jamais entendu parler.','Le Concierge');await wait(20);await say('… Mais ça sonne bien. Passez.','Le Concierge');
  G.flags.bridge=true;await walkTo(o,[[1,0],[1,0],[0,-1]]);o.dir=0;SFX.blower();await say('Le Concierge reprend sa machine. VRRRRR. Les feuilles s\'envolent vers la Forêt des Copeaux.');await say('Le Pont des Apprentis est ouvert ! Au-delà s\'étend la Forêt des Copeaux.');}

    if(i===1){SFX.sel();break;}await say(i===0?'Le chêne n\'est pas à gauche, c\'est dans l\'énoncé. Relis bien.':'Si le sapin était à gauche, il ne pourrait pas être à droite du chêne. Hmm.','guilhem');const r=await ask('On réessaie ?',['Oui','Plus tard'],'guilhem');if(r!==0)return;}

async function questYvain(o){

function nf(n){const m=/^([A-G])(#|b)?(\d)$/.exec(n);if(!m)return 0;const b={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);return 440*Math.pow(2,((+m[3]+1)*12+b-69)/12);}
function trk(name){const t=TRACKS[name];if(!t.L){const tok=x=>x.replace(/\|/g,' ').trim().split(/\s+/);t.L=tok(t.lead);t.Bs=tok(t.bass);}return t;}

  const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+.008);gn.gain.linearRampToValueAtTime(vol*.6,t+Math.min(.15,dur*.5));gn.gain.setValueAtTime(vol*.6,t+dur*.85);gn.gain.linearRampToValueAtTime(0,t+dur*.98);o.connect(gn).connect(MUS.gain);o.start(t);o.stop(t+dur);}
function drum(i,t,kind){if(!MUS.nb){const n=Math.floor(AC.sampleRate*.05),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let k=0;k<n;k++)d[k]=(Math.random()*2-1)*(1-k/n);MUS.nb=b;}
  if(i%2===0||kind===2){const s=AC.createBufferSource();s.buffer=MUS.nb;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=6000;const g=AC.createGain();g.gain.value=.05;s.connect(f).connect(g).connect(MUS.gain);s.start(t);}
  if(i%8===0||(kind===2&&i%4===0)){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g).connect(MUS.gain);o.start(t);o.stop(t+.15);}}

  for(let i=waits.length-1;i>=0;i--){const w=waits[i];if(w.pred?w.pred():--w.n<=0){waits.splice(i,1);w.r();}}
  for(let i=tweens.length-1;i>=0;i--){const t=tweens[i];t.i++;const k=Math.min(1,t.i/t.n);t.o[t.k]=t.from+(t.to-t.from)*EASE[t.ease](k);if(k>=1){tweens.splice(i,1);t.r();}}
  if(!UI.update()&&scene)scene.update();if(T%6===0){musicPlay(pickMusic());musicTick();}}
function render(){g.setTransform(1,0,0,1,0,0);g.imageSmoothingEnabled=false;if(scene)scene.draw(g);D.setTransform(1,0,0,1,0,0);D.imageSmoothingEnabled=false;D.drawImage(low,0,0,SW*S,SH*S);
  if(scene&&scene.ui)scene.ui();if(FADE>0){D.fillStyle=`rgba(8,6,14,${FADE})`;D.fillRect(0,0,960,640);}UI.draw();if(FLASH>0){D.fillStyle=`rgba(255,255,255,${FLASH})`;D.fillRect(0,0,960,640);}drawToast();}
let last=performance.now(),acc=0;
function frame(now){acc+=Math.min(120,now-last);last=now;while(acc>=1000/60){tick();acc-=1000/60;}render();requestAnimationFrame(frame);}
D.fillStyle='#15121d';D.fillRect(0,0,960,640);D.fillStyle='#9d95b0';D.font='24px sans-serif';D.textAlign='center';D.fillText('Chargement…',480,330);D.textAlign='left';
const fontsReady=document.fonts?Promise.all([document.fonts.load(F_DLG),document.fonts.load(F_UI),document.fonts.load(PS(20))]).catch(()=>{}):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,2500))]).then(()=>{scene=TITLE;requestAnimationFrame(frame);cv.focus({preventScroll:true});});
</script>
